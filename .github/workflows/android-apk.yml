name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SW411_SIGNING_KEY_B64: ${{ secrets.SW411_SIGNING_KEY_B64 }}
      SW411_SIGNING_STORE_PASSWORD: ${{ secrets.SW411_SIGNING_STORE_PASSWORD }}
      SW411_SIGNING_KEY_ALIAS: ${{ secrets.SW411_SIGNING_KEY_ALIAS }}
      SW411_SIGNING_KEY_PASSWORD: ${{ secrets.SW411_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        if: env.SW411_SIGNING_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/SW411-Control-release.p12"
          printf '%s' "$SW411_SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "SW411_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.SW411_SIGNING_KEY_B64 != ''
        run: gradle -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify release signature
        id: release_signature
        if: env.SW411_SIGNING_KEY_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Build debug APK when signing secrets are missing
        id: debug_build
        if: env.SW411_SIGNING_KEY_B64 == ''
        run: |
          echo "::warning::Release signing secrets are not configured; building debug APK."
          gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Start Android 15 test device
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sw411-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'tail -n 100 "$RUNNER_TEMP/sw411-emulator.log" 2>/dev/null || true' EXIT
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --name sw411-native-ui --package "system-images;android-35;google_apis;x86_64" --device pixel_5
          nohup "$ANDROID_HOME/emulator/emulator" -avd sw411-native-ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/sw411-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          BOOTED=0
          for attempt in {1..120}; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator process exited"
              exit 1
            fi
            BOOT_STATE="$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "Emulator boot attempt $attempt: $BOOT_STATE"
            if [ "$BOOT_STATE" = "1" ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 1
          adb shell input keyevent 82
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Test native screens and controls
        run: gradle -p android :app:connectedDebugAndroidTest --stacktrace

      - name: Collect native UI checks
        if: always()
        shell: bash
        run: |
          mkdir -p native-ui-checks
          if adb get-state >/dev/null 2>&1; then
            adb pull /sdcard/Pictures/SW411-native-ui native-ui-checks/screenshots || true
          fi
          if [ -d android/app/build/reports ]; then
            cp -R android/app/build/reports native-ui-checks/reports
          fi
          if [ -f "$RUNNER_TEMP/sw411-emulator.log" ]; then
            cp "$RUNNER_TEMP/sw411-emulator.log" native-ui-checks/emulator.log
          fi

      - name: Upload native UI checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SW411-Native-UI-Checks
          path: native-ui-checks/
          retention-days: 3
          if-no-files-found: ignore

      - name: Prepare artifact
        if: always() && (steps.release_signature.outcome == 'success' || steps.debug_build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -n "$SW411_SIGNING_KEY_B64" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/SW411-Control-release.apk
            sha256sum out/SW411-Control-release.apk | tee out/SW411-Control-release.apk.sha256
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/SW411-Control-debug.apk
            sha256sum out/SW411-Control-debug.apk | tee out/SW411-Control-debug.apk.sha256
          fi

      - name: Upload APK
        if: always() && (steps.release_signature.outcome == 'success' || steps.debug_build.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: SW411-Control-Android
          path: out/
          retention-days: 7
          if-no-files-found: error

